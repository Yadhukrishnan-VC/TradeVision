version: "3.9"

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_tradevision_db
      POSTGRES_USER: tradevision
      POSTGRES_PASSWORD: tradevision_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradevision"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
