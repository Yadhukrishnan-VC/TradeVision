services:
  # ---------------------------------------------------------------------------
  # Data tier — postgres is the TimescaleDB-enabled primary; pgbouncer pools
  # connections between the application layer and postgres so Celery workers
  # do not exhaust pg max_connections under concurrent load.
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: 6432
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      STATS_USERS: ${POSTGRES_USER}
      ADMIN_USERS: ${POSTGRES_USER}
    networks:
      - data
      - app
    depends_on:
      postgres:
        condition: service_healthy
    # psql-based probe — this image is Alpine (no bash), so the TCP probe used
    # with the old bitnami image is not available here.
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -w -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence (everysec fsync) for broker durability; LRU eviction
    # policy with 512 MB cap prevents unbounded growth from stale task results.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Application tier — all share the same image; queue routing differentiates
  # the Celery workers.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    env_file:
      - .env
    volumes:
      - static-files:/app/staticfiles
      - media-files:/app/mediafiles
    networks:
      - app
      - edge
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Health check requires the /api/v1/health/ endpoint, added in Phase 1.
    # Until then the container runs but reports unhealthy — expected in Phase 0.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint: ["/entrypoint.backend.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "--proxy-headers", "config.asgi:application"]

  # Handles: market_data · processing · intelligence · rule_engine queues
  celery-worker-market:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    env_file:
      - .env
    networks:
      - app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint: ["/entrypoint.celery.sh"]
    command:
      - celery
      - -A
      - config.celery
      - worker
      - --queues=market_data,processing,intelligence,rule_engine
      - --loglevel=info
      - --concurrency=4
      - --hostname=worker-market@%h

  # Handles: ai queue — concurrency limited to honour API rate limits
  celery-worker-ai:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    env_file:
      - .env
    networks:
      - app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint: ["/entrypoint.celery.sh"]
    command:
      - celery
      - -A
      - config.celery
      - worker
      - --queues=ai
      - --loglevel=info
      - --concurrency=2
      - --hostname=worker-ai@%h

  # Handles: notifications · analytics · default queues
  celery-worker-default:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    env_file:
      - .env
    networks:
      - app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint: ["/entrypoint.celery.sh"]
    command:
      - celery
      - -A
      - config.celery
      - worker
      - --queues=notifications,analytics,default
      - --loglevel=info
      - --concurrency=4
      - --hostname=worker-default@%h

  # Single Beat instance — only one must run to avoid duplicate scheduled tasks
  celery-beat:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    env_file:
      - .env
    networks:
      - app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint: ["/entrypoint.celery.sh"]
    command:
      - celery
      - -A
      - config.celery
      - beat
      - --loglevel=info
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite app
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
    networks:
      - edge
    # start_period is generous because `npm install` runs at container start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 2>/dev/null | grep -q html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Edge — Nginx reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - static-files:/app/staticfiles:ro
      - media-files:/app/mediafiles:ro
    ports:
      - "80:80"
    networks:
      - edge
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health 2>/dev/null | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  static-files:
  media-files:

networks:
  # Public-facing: nginx, frontend, backend
  edge:
    driver: bridge
  # Internal application traffic: backend, workers, redis, pgbouncer
  app:
    driver: bridge
  # Database tier: postgres, pgbouncer only
  data:
    driver: bridge