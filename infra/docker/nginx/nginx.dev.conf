worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # ------------------------------------------------------------------
        # Internal health check — used by Docker health probe only
        # ------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Django Admin
        # ------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------------------------------
        # Django REST API
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------------------------------
        # WebSocket — Django Channels
        # Upgrade headers are required; read_timeout is long for persistent
        # WebSocket connections (market data streaming).
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ------------------------------------------------------------------
        # Static files (Django collectstatic output)
        # ------------------------------------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # ------------------------------------------------------------------
        # Media files (user uploads)
        # ------------------------------------------------------------------
        location /media/ {
            alias /app/mediafiles/;
        }

        # ------------------------------------------------------------------
        # Frontend — Vite dev server with HMR WebSocket passthrough
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
